# Render Blueprint. Connect this repository, pick the branch you want to deploy,
# and Render creates the service from this file.
services:
  - type: web
    name: bcoe-attendance-chain
    runtime: python
    plan: free
    region: singapore
    branch: arena/01a0e97f-attendancebt
    autoDeploy: true
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn "app:create_app()" --bind 0.0.0.0:$PORT --workers 1 --threads 8 --timeout 120
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: SECRET_KEY
        generateValue: true
      - key: STORAGE_BACKEND
        value: auto
      - key: CHAIN_DIFFICULTY
        value: "4"
      - key: QR_TOKEN_TTL
        value: "30"
      - key: ACADEMIC_YEAR
        value: 2026-27
      - key: APP_DEBUG
        value: "false"
      # Set these two in the Render dashboard (they are secrets, and Render asks
      # for them when the Blueprint is created).
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT
        sync: false
